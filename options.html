<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>한국학 공구서 옵션</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 20px 24px;
      color: #111827;
      min-width: 320px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 16px;
      color: #374151;
    }
    .option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      cursor: pointer;
    }
    .option input {
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
    .option-title {
      font-size: 13px;
      font-weight: 500;
    }
    .option-desc {
      font-size: 12px;
      color: #6b7280;
      margin: 2px 0 12px 22px;
      line-height: 1.4;
    }
    #status {
      font-size: 12px;
      color: #10b981;
      height: 16px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>한국학 공구서 옵션</h1>

  <label class="option">
    <input type="checkbox" id="selectionTooltipEnabled">
    <span class="option-title">웹페이지에서 드래그 툴팁 사용</span>
  </label>
  <div class="option-desc">
    페이지 안에서 텍스트를 선택하면 작은 아이콘이 표시되고, 클릭하여 동양연표로 조회할 수 있습니다.
    처음 켤 때 브라우저가 웹페이지 접근 권한을 요청합니다.
  </div>

  <label class="option">
    <input type="checkbox" id="contextMenuEnabled">
    <span class="option-title">우클릭 메뉴에 "한국학 웹사전에서 검색" 추가</span>
  </label>
  <div class="option-desc">
    웹페이지에서 텍스트를 선택하고 우클릭하면 사전 검색 메뉴가 나타납니다.
  </div>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
